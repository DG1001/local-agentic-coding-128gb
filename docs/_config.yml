title: Local agentic coding on 128 GB
description: >-
  Seven large local LLMs, four realistic coding tasks, 86 hidden tests each,
  on one ASUS Ascent GX10 (NVIDIA GB10, DGX Spark class).

remote_theme: just-the-docs/just-the-docs

# The report is mostly tables and charts; search is what makes the
# cross-references between the five pages usable.
search_enabled: true
search:
  heading_level: 3
  previews: 3

color_scheme: light
heading_anchors: true

aux_links:
  "Repository on GitHub":
    - "https://github.com/DG1001/local-agentic-coding-128gb"
aux_links_new_tab: true

# Footer: this report corrects itself in public, and that belongs on the page.
footer_content: >-
  MIT licence. Every number here comes from <code>results/*.json</code>, and the
  charts are generated from it by <code>tools/charts.py</code>. Corrections to
  earlier revisions are stated in the text rather than quietly removed.

back_to_top: true
back_to_top_text: "back to top"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - charts/*.py
